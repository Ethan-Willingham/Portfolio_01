<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex"><title>Widewake / Sea trial</title>
  <link rel="icon" href="favicon.svg"><link rel="stylesheet" href="widewake-battle.css?v=0.36.1">
  <script defer src="js/demo-activity.js"></script>
  <script defer src="js/widewake-waves.js?v=0.36.1"></script>
<script defer src="js/widewake-battle-core.js?v=0.36.1"></script>
  <script defer src="js/widewake-ocean-art.js?v=0.36.1"></script>
  <script defer src="js/widewake-ocean.js?v=0.36.1"></script><script defer src="js/widewake-wave-view.js?v=0.36.1"></script>
  <script defer src="js/widewake-audio.js?v=0.36.1"></script>
  <script defer src="js/widewake-battle.js?v=0.36.1"></script>
</head>
<body>
<main id="battle" aria-label="Widewake endgame sea trial">
  <canvas id="battle-ocean" tabindex="0" aria-label="Isometric sea. WASD steers. Hold the sea to aim and fire. Space fires a broadside. Mouse wheel zooms. Escape pauses."></canvas>
  <header class="battle-top"><div class="battle-hull"><span>FLAGSHIP</span><strong id="hull-value">6,000</strong><div class="meter"><i id="hull-bar"></i></div></div><div class="battle-work"><span id="work-label">PROTECT THE WORKBOATS</span><strong id="work-clock">3:00</strong><div class="meter"><i id="work-bar"></i></div><small id="work-cargo">0 fish / 0 oil</small></div><button id="pause" aria-label="Pause sea trial">Pause</button></header>
  <div class="battle-tally"><strong id="kills">0</strong><span>SUNK</span><small id="contacts">16,384 incoming</small></div>
  <nav class="battle-zoom" aria-label="Camera distance"><button data-zoom="helm">Helm</button><button data-zoom="fleet" aria-pressed="true">Fleet</button><button data-zoom="survey">Survey</button></nav>
  <div class="battle-controls"><div id="helm" role="application" aria-label="Touch helm. Drag to steer."><i></i></div><button id="broadside" aria-keyshortcuts="Space">Broadside <kbd>Space</kbd><span id="broadside-clock"></span></button><button id="work-toggle">Get underway</button></div>
  <button id="metrics-toggle" aria-expanded="false" aria-controls="metrics">Performance</button>
  <output id="metrics" hidden></output>
  <dialog id="battle-menu" aria-labelledby="battle-menu-title"><p class="kicker">WIDEWAKE / SEA TRIAL</p><h1 id="battle-menu-title">Hold the water.</h1><p id="battle-menu-detail">24 boats. Four working holds. Keep them afloat.</p><button id="resume" class="primary">Launch</button><button id="restart">Restart trial</button><label class="sound-option"><input id="sound" type="checkbox" checked> Sound</label><a href="widewake-estuary.html">Bracken Reach</a><a href="widewake.html">Return to Widewake</a><small>0.36.1 / Development trial</small></dialog>
  <p id="battle-error" role="alert" hidden></p>
</main>
</body>
</html>
