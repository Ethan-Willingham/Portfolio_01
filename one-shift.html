<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#242d35">
  <title>One Shift</title>
  <meta name="description" content="Stock the racks. Ship customer orders. Reinvest your earnings and grow a small warehouse.">
  <link rel="canonical" href="https://ethanwillingham.com/one-shift.html">
  <meta property="og:title" content="One Shift">
  <meta property="og:description" content="Stock the racks. Ship customer orders. Reinvest your earnings and grow a small warehouse.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ethanwillingham.com/one-shift.html">
  <meta property="og:image" content="https://ethanwillingham.com/assets/thumbs/one-shift-og.jpg?v=6">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <link rel="stylesheet" href="one-shift.css?v=22">
</head>
<body class="shift-page">
<main id="shift-game" aria-label="One Shift warehouse game">
  <h1 class="sr-only">One Shift</h1>
  <canvas id="shift-canvas" tabindex="0" aria-label="Warehouse floor. Tab selects objects. Enter interacts. Arrow keys move the selection cursor. Space pauses.">This game needs canvas support.</canvas>
  <header class="shift-hud">
    <div class="shift-clock"><span id="shift-day">DAY 1</span><output id="shift-clock">8:00 AM</output></div>
    <div class="shift-speed" role="group" aria-label="Time controls"><button id="shift-pause" aria-label="Pause" aria-pressed="false">Pause</button><button data-speed="1" aria-pressed="true">1x</button><button data-speed="2" aria-pressed="false">2x</button><button data-speed="3" aria-pressed="false">3x</button></div>
    <div class="shift-cash"><span>CASH</span><output id="shift-money">$200</output></div>
    <button id="shift-menu" aria-label="Open game menu">Menu</button>
    <div id="shift-timeline" aria-label="Today's truck schedule"></div>
  </header>
  <button id="shift-next-truck" data-action="next-truck" hidden>Next truck</button>
  <aside id="shift-selection" class="shift-panel" aria-label="Selected object" hidden></aside>
  <aside id="shift-queue" class="shift-queue" aria-label="Customer orders, stock and worker queue"><section id="shift-intro" aria-label="Your next step" hidden></section><button data-action="queue-toggle" aria-expanded="true" aria-controls="shift-queue-body"><strong>Work queue</strong><span id="shift-queue-summary">Ready</span></button><div id="shift-queue-body"></div></aside>
  <nav class="shift-toolbar" id="shift-toolbar" aria-label="Warehouse tools" hidden><button data-hub="contracts">Contracts</button><button data-hub="shop">Shop</button><button data-hub="build">Build</button><button data-hub="people">People</button><button data-hub="services">Services</button><button data-hub="reports">Reports</button></nav>
  <div class="shift-bottom"><span class="shift-wordmark">One Shift</span><p id="shift-hint" role="status">A truck is on its way to Door 1.</p><div class="shift-camera"><button id="shift-zoom-out" aria-label="Zoom out">-</button><button id="shift-zoom-in" aria-label="Zoom in">+</button></div></div>
  <p id="shift-toast" role="status" aria-live="polite" hidden></p>
  <section id="shift-hub" class="shift-hub" aria-label="Warehouse evening" hidden></section>
  <dialog id="shift-settings" aria-labelledby="shift-settings-title"></dialog>
  <div id="shift-rotate" hidden><h2>Turn your phone sideways.</h2><p>Your shift will wait.</p></div>
  <p class="sr-only" id="shift-live" aria-live="polite" aria-atomic="true"></p>
</main>
<script src="js/one-shift-data.js?v=22"></script>
<script src="js/one-shift-content.js?v=22"></script>
<script src="js/one-shift-labels.js?v=22"></script>

<script src="js/one-shift-economy.js?v=22"></script>
<script src="js/one-shift-sim.js?v=22"></script>
<script src="js/one-shift-fulfillment.js?v=22"></script>
<script src="js/one-shift-rules.js?v=22"></script>
<script src="js/one-shift-saves.js?v=22"></script>
<script src="js/one-shift-commerce.js?v=22"></script>
<script src="js/one-shift-sprites.js?v=22"></script>
<script src="js/one-shift-lighting.js?v=22"></script>
<script src="js/one-shift-renderer.js?v=22"></script>
<script src="js/one-shift-audio.js?v=22"></script>
<script src="js/one-shift-ui.js?v=22"></script>
<script src="js/one-shift-queue.js?v=22"></script>
<script src="js/one-shift-intro.js?v=22"></script>
<script src="js/one-shift-business-ui.js?v=22"></script>
<script src="js/one-shift-input.js?v=22"></script>
<script src="js/one-shift-main.js?v=22"></script>
</body>
</html>
