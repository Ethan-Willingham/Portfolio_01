<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex"><title>Widewake / Bracken Reach</title>
  <link rel="icon" href="favicon.svg"><link rel="stylesheet" href="widewake-battle.css?v=0.31.0"><link rel="stylesheet" href="widewake-estuary.css?v=0.31.0">
  <script src="js/widewake-estuary-entry.js?v=0.31.0"></script><script defer src="js/demo-activity.js"></script><script defer src="js/widewake-waves.js?v=0.31.0"></script>
<script defer src="js/widewake-battle-core.js?v=0.31.0"></script><script defer src="js/widewake-waterway-art.js?v=0.31.0"></script>
<script defer src="js/widewake-ocean-art.js?v=0.31.0"></script><script defer src="js/widewake-ocean.js?v=0.31.0"></script><script defer src="js/widewake-wave-view.js?v=0.31.0"></script><script defer src="js/widewake-audio.js?v=0.31.0"></script>
  <script defer src="js/widewake-waterways.js?v=0.31.0"></script>
<script defer src="js/widewake-estuary-core.js?v=0.31.0"></script><script defer src="js/widewake-estuary-view.js?v=0.31.0"></script><script defer src="js/widewake-estuary.js?v=0.31.0"></script>
</head>
<body>
<main id="reach" aria-label="Widewake navigation trial">
  <canvas id="reach-water" tabindex="0" aria-label="Bracken Reach. WASD steers, M opens the chart, Escape pauses."></canvas>
  <header class="reach-top"><div><span id="place">BRACKEN REACH</span><strong id="sounder">9.0 m</strong><small id="water-kind">Brackish water</small></div><button id="reach-pause" aria-label="Pause navigation">Pause</button></header>
  <div id="reach-notice" role="status" aria-live="polite"></div>
  <div class="reach-controls"><div id="reach-helm" role="application" aria-label="Touch helm. Drag to steer."><i></i></div></div>
  <div class="reach-actions"><button id="chart-open">Chart <kbd>M</kbd></button><div class="reach-zoom" aria-label="Camera distance"><button data-zoom="helm">Helm</button><button data-zoom="fleet" aria-pressed="true">Channel</button><button data-zoom="survey">Survey</button></div></div>
  <div class="reach-course" id="course" hidden><span id="course-name"></span><button id="take-helm">Take helm</button></div>
  <dialog id="reach-menu" aria-labelledby="reach-title"><p class="kicker">WIDEWAKE / NAVIGATION TRIAL</p><h1 id="reach-title">Bracken Reach.</h1><div class="boat-picker" aria-label="Trial vessel"><button data-boat="launch" aria-pressed="true">Launch</button><button data-boat="gunboat">Escort</button><button data-boat="oilrig">Industrial</button></div><p id="boat-info">6 m hull / 0.45 m draft</p><button id="reach-resume" class="primary" disabled>Preparing water...</button><label class="sound-option"><input id="reach-sound" type="checkbox" checked> Sound</label><details><summary>Controls</summary><p>WASD or arrows steer. Wheel or pinch to zoom. Drag the water to look around. M opens the chart.</p></details><a href="widewake-battle.html">Sea trial</a><a href="widewake.html">Return to Widewake</a><small>0.31.0 / Development trial</small></dialog>
  <dialog id="reach-chart" aria-labelledby="chart-title"><header><h2 id="chart-title">Bracken Reach</h2><button id="chart-close" aria-label="Close chart">Close</button></header><canvas id="chart-map" aria-label="Chart of Tern Yard, Lockmill, and the shallow Reed Landing"></canvas><div class="chart-destinations"><button data-port="yard">Tern Yard</button><button data-port="mill">Lockmill</button><button data-port="reeds">Reed Landing</button></div><footer><div><strong id="route-name">Choose a landing</strong><span id="route-detail"></span></div><button id="set-course" disabled>Set course</button></footer></dialog>
  <p id="reach-error" role="alert" hidden></p>
</main>
</body>
</html>
