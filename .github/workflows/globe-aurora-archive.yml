name: Archive globe weather sources

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: globe-aurora-archive
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture and publish the data subtree
        shell: bash
        run: |
          set -euo pipefail
          successful=0
          for sample in {1..12}; do
            if node tools/archive-globe-weather.cjs; then
              successful=$((successful + 1))
            else
              echo 'Capture failed; retaining existing sources.'
            fi
            git add -A -- assets/data/aurora assets/data/globe-cloud-catalog.json assets/data/globe-hourly-catalog.json
            if git diff --cached --quiet -- assets/data/aurora assets/data/globe-cloud-catalog.json assets/data/globe-hourly-catalog.json; then
              echo 'No new weather frame or retention change.'
              if [ "$sample" -lt 12 ]; then sleep 300; fi
              continue
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Archive globe weather sources' -- assets/data/aurora assets/data/globe-cloud-catalog.json assets/data/globe-hourly-catalog.json
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                break
              fi
              if [ "$attempt" -eq 1 ]; then sleep 5; else sleep 15; fi
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo 'Archive publication stopped because main changed incompatibly.' >&2
                exit 1
              fi
            done
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo 'Archive publication failed after three push attempts.' >&2
              exit 1
            fi
            if [ "$sample" -lt 12 ]; then sleep 300; fi
          done
          if [ "$successful" -eq 0 ]; then exit 1; fi
