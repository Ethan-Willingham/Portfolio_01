<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wikipedia Art Grid</title>
<meta name="description" content="250 random Wikipedia articles, each turned into a square of art. An artwork in progress.">
<link rel="canonical" href="https://ethanwillingham.com/wiki-pixel-grid.html">
<meta property="og:title" content="Wikipedia Art Grid">
<meta property="og:description" content="250 random Wikipedia articles, each turned into a square of art. An artwork in progress.">
<meta property="og:url" content="https://ethanwillingham.com/wiki-pixel-grid.html">
<link rel="stylesheet" href="style.css">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
#grid{display:block;width:100%;height:100dvh;touch-action:none;cursor:grab;outline:none}
#grid:active{cursor:grabbing}
#grid:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style>
<script src="js/wiki-pixel-grid.js?v=1" defer></script>
</head>
<body>
<h1 class="sr-only">Wikipedia Art Grid</h1>
<p id="instructions" class="sr-only">An artwork in progress. Drag to pan. Scroll or pinch to zoom. Click or tap a tile to open its Wikipedia article in a new tab. Use arrow keys to pan, plus and minus to zoom, Home to fit all tiles, and Enter to open the center tile. Article links follow the canvas.</p>
<canvas id="grid" tabindex="0" role="img" aria-label="250 equal squares of Wikipedia-inspired art" aria-describedby="instructions"></canvas>
<p id="status" class="sr-only" role="status" aria-live="polite"></p>
<ul id="article-links" class="sr-only" aria-label="Artwork source articles"></ul>
<noscript><p>This artwork needs JavaScript. <a href="archive.html">Return to In Progress.</a></p></noscript>
</body>
</html>
