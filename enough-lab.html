<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Enough design chooser</title><link rel="stylesheet" href="style.css?v=20261004"><link rel="stylesheet" href="enough.css?v=1"><style>
.lab-controls { display:flex; flex-wrap:wrap; gap:.6rem; margin:1rem 0; }
.lab-controls button, .lab-controls select { background:var(--bg-raised); color:var(--text); border:1px solid var(--rule-strong); padding:.7rem; min-height:44px; font:inherit; font-size:1rem; cursor:pointer; }
.lab-controls .selected { border-color:var(--accent); color:var(--accent); }
.lab-note { font-size:1rem; line-height:1.6; margin:1rem 0 2rem; }
[data-layout="stack"] .enough-grid { grid-template-columns:1fr; max-width:720px; margin:auto; }
[data-layout="picker"] .enough-card { display:none; }
[data-layout="picker"] .enough-card.chosen { display:block; }
[data-layout="picker"] .enough-grid { display:block; max-width:720px; margin:auto; }
[data-layout="columns"] .enough-grid { grid-template-columns:repeat(3,minmax(0,1fr)); gap:2rem; }
[data-chart="area"] .e-line { stroke-width:5; }
[data-chart="dots"] .e-line { display:none; }
@media(max-width:900px){[data-layout="columns"] .enough-grid{grid-template-columns:1fr;}}
</style><script defer src="js/enough-data.js?v=1"></script><script defer src="js/enough.js?v=1"></script></head><body><div class="enough-shell" id="lab-shell" data-layout="grid" data-chart="line"><nav class="enough-top"><a href="enough.html">Current page</a></nav><header class="u-hero enough-hero"><h1 class="u-title" id="lab-title">How Much Is Enough?</h1><p class="u-dek">Where more helps, where it stops, and where we still don't know.</p></header><p class="lab-note">Provisional choices: two columns, thin line with visible source dots, and How Much Is Enough? The grid lets several shapes sit together. A single column stays readable on phones.</p><div class="lab-controls" aria-label="Layout choices"><button data-layout="grid" class="selected">Two columns</button><button data-layout="stack">Scrolling stack</button><button data-layout="picker">One chart and picker</button><button data-layout="columns">Three columns</button><label>Chart <select id="lab-picker"></select></label></div><div class="lab-controls" aria-label="Chart style choices"><button data-chart="line" class="selected">Thin line and dots</button><button data-chart="area">Heavy line and dots</button><button data-chart="dots">Source dots only</button></div><div class="lab-controls"><label>Title <select id="lab-titles"><option>How Much Is Enough?</option><option>When More Helps</option><option>The Returns on Daily Life</option><option>How Much Changes the Outcome?</option><option>Where the Benefits Level Off</option></select></label></div><main><div id="enough-grid" class="enough-grid"></div><p id="enough-loading">Loading charts.</p><div hidden><ol id="enough-sources"></ol><form id="enough-form"><input name="steps"><input name="sleep"><input name="protein"><input name="weight"><input name="exercise"><input name="work"></form><div id="enough-results"></div></div></main></div><script>
window.addEventListener('DOMContentLoaded',()=>{const shell=document.getElementById('lab-shell'),picker=document.getElementById('lab-picker');for(const c of EnoughData.curves){const o=document.createElement('option');o.value=c.id;o.textContent=c.question;picker.append(o);}const choose=()=>document.querySelectorAll('.enough-card').forEach(c=>c.classList.toggle('chosen',c.id===picker.value));picker.addEventListener('change',choose);choose();document.querySelectorAll('button[data-layout],button[data-chart]').forEach(b=>b.addEventListener('click',()=>{const key=b.dataset.layout?'layout':'chart';shell.dataset[key]=b.dataset[key];document.querySelectorAll('button[data-'+key+']').forEach(x=>x.classList.toggle('selected',x===b));}));document.getElementById('lab-titles').addEventListener('change',e=>document.getElementById('lab-title').textContent=e.target.value);});
</script></body></html>
