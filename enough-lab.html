<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Enough choices</title><link rel="stylesheet" href="style.css?v=20261004"><link rel="stylesheet" href="enough.css?v=3-8"><style>body{padding:20px}.lab-controls{display:flex;flex-wrap:wrap;gap:16px;margin:16px 0}label{font-size:1rem}select{display:block;min-height:44px;background:var(--bg-raised);color:var(--text);border:1px solid var(--rule-strong);font:inherit;padding:8px}iframe{width:100%;height:85vh;border:1px solid var(--rule-strong)}h1{font:2.5rem var(--font-heading)}</style></head><body><h1>Enough choices</h1><p>Provisional: The Harvesters, walking first, a color for each area. Each option previews the actual page.</p><div class="lab-controls"><label>Painting<select id="lab-painting"><option value="harvesters">Bruegel, The Harvesters</option><option value="homer">Homer, Breezing Up</option><option value="chardin">Chardin, Fruit, Jug, and a Glass</option></select></label><label>Opening curve<select id="lab-curve"><option value="steps">Walking</option><option value="exercise">Exercise</option><option value="protein">Protein</option></select></label><label>Colors<select id="lab-colors"><option value="areas">A color per area</option><option value="quiet">Quiet, one warm color</option></select></label></div><p><a id="lab-open" href="enough.html">Open this combination</a></p><iframe title="Enough page preview" src="enough.html"></iframe><script>const options=[document.getElementById('lab-painting'),document.getElementById('lab-curve'),document.getElementById('lab-colors')];function update(){const url='enough.html?'+new URLSearchParams({painting:options[0].value,curve:options[1].value,colors:options[2].value});document.querySelector('iframe').src=url;document.getElementById('lab-open').href=url;}options.forEach(el=>el.addEventListener('change',update));</script></body></html>
