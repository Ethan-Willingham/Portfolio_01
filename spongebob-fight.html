  <meta property="og:url" content="https://ethanwillingham.com/spongebob-fight.html">

<body>
  <div class="sb-app-shell">
    <header class="sb-app-header"><div class="sb-app-title"><h1>Bikini Bottom Showdown</h1></div></header>
    <main class="sb-app-main">
      <section class="sb-fight" id="sb-fight" aria-label="SpongeBob fight vote" aria-busy="true">
        <div class="sb-empty" id="sb-load-state" role="status"><p>Finding the first matchup...</p><button class="sb-button" id="sb-load-retry" type="button" hidden>Try again</button></div>
        <div class="sb-matchup" id="sb-matchup" hidden>
          <button class="sb-fighter sb-fighter-left" id="sb-fighter-left" type="button" disabled><span class="sb-fighter-image" id="sb-image-left"></span><span class="sb-fighter-name" id="sb-name-left"></span><span class="sb-fighter-prompt" id="sb-prompt-left">Choose winner</span><span class="sb-fighter-result" id="sb-result-left" hidden></span><span class="sb-fighter-count" id="sb-count-left" hidden></span><span class="sb-result-track" id="sb-track-left" hidden aria-hidden="true"><i></i></span></button>
          <span class="sb-versus" aria-hidden="true">VS</span>
          <button class="sb-fighter sb-fighter-right" id="sb-fighter-right" type="button" disabled><span class="sb-fighter-image" id="sb-image-right"></span><span class="sb-fighter-name" id="sb-name-right"></span><span class="sb-fighter-prompt" id="sb-prompt-right">Choose winner</span><span class="sb-fighter-result" id="sb-result-right" hidden></span><span class="sb-fighter-count" id="sb-count-right" hidden></span><span class="sb-result-track" id="sb-track-right" hidden aria-hidden="true"><i></i></span></button>
        </div>
        <div class="sb-vote-state" id="sb-vote-state" hidden><p id="sb-vote-status" role="status" aria-live="polite" aria-atomic="true"></p><p class="sb-note" id="sb-vote-total" hidden></p><button class="sb-button" id="sb-vote-retry" type="button" hidden>Try again</button></div>
        <div class="sb-round-actions" id="sb-round-actions" hidden><button class="sb-button sb-primary" id="sb-next" type="button" hidden>Next matchup</button><button class="sb-text-button" id="sb-refresh" type="button" hidden>Refresh results</button></div>
        <div class="sb-empty sb-complete" id="sb-complete" hidden><h2>Round complete</h2><button class="sb-button sb-primary" id="sb-restart" type="button">Play another round</button></div>
        <noscript><p class="sb-empty">Turn on JavaScript to show the characters and save your vote.</p></noscript>
      </section>
    </main>
    <footer class="sb-app-footer"><a href="/">&copy; 2026 Ethan Willingham</a></footer>
  </div>
  <script src="js/spongebob-shared.js?v=7"></script>
  <script src="js/spongebob-votes.js?v=1"></script>
  <script src="js/spongebob-fight.js?v=4"></script>
</body>
</html>
