<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Let me LLM homepage thumbnail source</title>
  <style>
    /* The tool just before send, with type and spacing adjusted for a thumbnail. */
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #171717; }
    body {
      display: grid; place-items: center; color: #ececec;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .chat { position: relative; width: 512px; height: 286px; }
    h1 {
      margin: 0; font-size: 44px; font-weight: 600; line-height: 1.15;
      letter-spacing: -.015em; text-align: center;
    }
    .caption { margin: 32px 0 23px; color: #a3a3a3; font-size: 22px; line-height: 28px; text-align: center; }
    .composer {
      position: relative; width: 100%; height: 102px;
      border: 1px solid #3a3a3a; border-radius: 26px; background: #171717;
      box-shadow: 0 5px 20px rgb(0 0 0 / 4%);
    }
    .question { margin: 14px 80px 14px 24px; font-size: 28px; line-height: 36px; }
    .send {
      position: absolute; right: 14px; bottom: 14px; display: grid; place-items: center;
      width: 44px; height: 44px; border-radius: 12px; background: #ececec; color: #171717;
    }
    .send svg { width: 23px; height: 23px; }
    .pointer {
      position: absolute; left: calc(100% - 42px); bottom: -20px; width: 44px; height: 55px;
      filter: drop-shadow(0 2px 2px rgb(0 0 0 / 20%));
    }
  </style>
</head>
<body>
  <div class="chat" aria-hidden="true">
    <h1>Let me LLM<br>that for you</h1>
    <p class="caption">Step 2: Press send</p>
    <div class="composer">
      <p class="question">How many ounces<br>are in a cup?</p>
      <div class="send"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h12m-5-5 5 5-5 5"/></svg></div>
      <svg class="pointer" viewBox="0 0 24 30" fill="#1c1c1c" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"><path d="M3 2v20l6-5 5 10 4-2-5-10h9z"/></svg>
    </div>
  </div>
</body>
</html>
